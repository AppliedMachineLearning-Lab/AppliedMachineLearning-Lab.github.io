title: AML Lab @ University of Bonn
description: The web page of the AML Lab @ Uni Bonn.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-paginate
paginate: 5
paginate_path: "/news/page:num/"

# Every lab paper lists Rafet Sifa as a co-author, so his author pages double as
# the lab's publication feed. See scripts/fetch_publications.py.
dblp_author_url: https://dblp.org/pid/122/7972.html
scholar_author_url: https://scholar.google.com/citations?user=4jBgqpcAAAAJ
permalink: /news-entry/:year-:month-:day-:title/
exclude:
  - README.md
  - vendor
